name: Build CartoonStudio Android APK

on:
  push:
    branches: [ main, master, "copilot/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.2.1
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.2.1.stable/"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Android SAF plugin AAR
        shell: bash
        run: |
          set -euo pipefail
          cd android-plugin
          gradle --no-daemon :GodotAndroidFilePicker:assembleRelease
          cd ..
          mkdir -p addons/GodotAndroidFilePicker/bin/release
          cp android-plugin/GodotAndroidFilePicker/build/outputs/aar/GodotAndroidFilePicker-release.aar addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar
          test -s addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          keytool -genkeypair -v -keystore "build/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=CartoonStudio,C=US"

      - name: Validate Godot project
        run: godot --headless --editor --path . --quit

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug Android build/CartoonStudio-debug.apk
          test -s build/CartoonStudio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-debug-apk
          path: build/CartoonStudio-debug.apk
          if-no-files-found: error
