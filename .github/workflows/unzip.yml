name: Build CartoonStudio APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot
          sudo install godot/Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. ~/.local/share/godot/export_templates/4.2.1.stable/

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Android plugin
        run: |
          cd android-plugin
          gradle --no-daemon :GodotAndroidFilePicker:assembleRelease
          cd ..
          mkdir -p addons/GodotAndroidFilePicker/bin/release
          cp android-plugin/GodotAndroidFilePicker/build/outputs/aar/GodotAndroidFilePicker-release.aar addons/GodotAndroidFilePicker/bin/release/GodotAndroidFilePicker.aar

      - name: Create keystore
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore build/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=CartoonStudio,C=US"

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug Android build/CartoonStudio-debug.apk
          test -s build/CartoonStudio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonStudio-debug-apk
          path: build/CartoonStudio-debug.apk