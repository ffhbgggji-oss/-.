name: Extract project ZIP

on:
workflow_dispatch:

permissions:
contents: write

jobs:
extract:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract ZIP
    run: |
      mkdir -p project
      python3 -c "import zipfile; zipfile.ZipFile('CartoonStudio-repaired.zip').extractall('project')"

  - name: Commit extracted files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add project
      git commit -m "Extract CartoonStudio project" || true
      git push
